<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#092438"><title>Carwash Tycoon</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#164966,#071827);color:#effbff;font:15px system-ui,sans-serif}main{max-width:520px;padding:18px;margin:auto}h1{font-size:25px;margin:0 0 4px}p{color:#b0d1df;margin:4px 0 16px}.stats,.upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stats div,.panel{background:#123247;border:1px solid #39627b;border-radius:14px;padding:12px}.stats small{display:block;color:#accddb;font-size:11px}.stats b{display:block;margin-top:4px;font-size:19px}.scene{position:relative;border-radius:18px;overflow:hidden;border:2px solid #487c90;margin:13px 0 8px;touch-action:none}canvas{display:block;width:100%;height:auto;touch-action:none}.hint{background:#123247a8;text-align:center;padding:9px;position:absolute;bottom:8px;left:8px;right:8px;border-radius:8px;font-size:12px;pointer-events:none}.row{display:flex;justify-content:space-between;gap:10px;margin:10px 0}.meter{background:#234f64;border-radius:20px;height:12px;overflow:hidden}.fill{background:#56e7c5;height:100%;width:0}button{cursor:pointer;border:0;border-radius:10px;padding:13px;font-weight:700;background:#62dff4;color:#072b3b;font:inherit}button:disabled{opacity:.45}.start{width:100%;font-weight:800;margin:13px 0}.panel{margin-top:12px}.panel h2{font-size:17px;margin:3px 0 12px}.upgrades{grid-template-columns:1fr 1fr}.upgrade{background:#20465c;color:white;border:1px solid #3f7189;text-align:left;min-height:92px;font-size:14px}.upgrade small{display:block;color:#b7d1df;margin:7px 0}.upgrade strong{color:#8ef3ce}.log{color:#b7d1df;min-height:26px;font-size:13px}footer{font-size:11px;color:#9bbbc8;text-align:center;padding:18px}
</style></head><body><main><h1>🚙 CARWASH TYCOON</h1><p>Van één wasbox naar een wasstraatimperium · <span id="level">Level 1</span></p><div class="stats"><div><small>Kas</small><b id="cash">€ 2.500</b></div><div><small>Gewassen</small><b id="washed">0</b></div><div><small>Reputatie</small><b id="rep">3,0 ★</b></div></div><div class="scene"><canvas id="game" width="480" height="340" aria-label="Veeg over het vuil op de auto om te wassen"></canvas><div class="hint" id="hint">Tik op Volgende klant om te starten</div></div><div class="row"><span id="status">Wasbox vrij</span><span id="percent">0% schoon</span></div><div class="meter"><div class="fill" id="fill"></div></div><button id="next" class="start">🚗 Volgende klant</button><div class="panel"><h2>🏗️ Upgrades</h2><div class="upgrades"><button class="upgrade" id="pressure">💦 Hogedrukreiniger<small>Sneller wassen · niveau <span id="pl"></span></small><strong id="pc"></strong></button><button class="upgrade" id="shampoo">✨ Premium shampoo<small>Meer opbrengst · niveau <span id="sl"></span></small><strong id="sc"></strong></button><button class="upgrade" id="ads">📢 Reclame<small>Extra fooi · niveau <span id="al"></span></small><strong id="ac"></strong></button><button class="upgrade" id="staff">👷 Medewerker<small>Automatisch wassen · niveau <span id="el"></span></small><strong id="ec"></strong></button></div></div><div class="panel"><h2>📋 Dagboek</h2><div id="log" class="log">Je eerste wasbox is geopend!</div></div><footer>Gratis speelbaar op mobiel en desktop · Voortgang lokaal opgeslagen</footer></main><script>
(()=>{"use strict";const $=id=>document.getElementById(id),canvas=$("game"),ctx=canvas.getContext("2d"),defaults={cash:2500,washed:0,rep:3,pressure:1,shampoo:1,ads:0,staff:0};let loaded={};try{loaded=JSON.parse(localStorage.getItem("carwash-v1"))||{}}catch{}const s={...defaults,...loaded},colors=["#ee5b55","#ffd44e","#65ccf0","#bf96fa","#64d8ad"];let busy=false,car=null,spots=[],finished=false,pointerDown=false,last=performance.now(),phase="idle",phaseStart=performance.now(),spray=null,particles=[];const money=x=>"€ "+Math.floor(x).toLocaleString("nl-NL"),save=()=>localStorage.setItem("carwash-v1",JSON.stringify(s)),cost=()=>({pressure:400*s.pressure,shampoo:600*s.shampoo,ads:750*(s.ads+1),staff:1200*(s.staff+1)}),rand=(a,b)=>a+Math.random()*(b-a);
function update(){const pct=busy&&spots.length?Math.round(100*(1-spots.reduce((a,p)=>a+p.d,0)/spots.length)):0;$("cash").textContent=money(s.cash);$("washed").textContent=s.washed;$("rep").textContent=s.rep.toFixed(1).replace(".",",")+" ★";$("level").textContent="Level "+(1+Math.floor(s.washed/8));$("percent").textContent=pct+"% schoon";$("fill").style.width=pct+"%";$("status").textContent=busy?(phase==="enter"?"Auto komt binnen":car.program):(phase==="exit"?"Auto vertrekt":"Wasbox vrij");$("hint").textContent=busy?(phase==="enter"?"Auto rijdt de wasbox binnen...":"Veeg over de modderplekken om de auto te wassen!"):"Tik op Volgende klant om te starten";$("next").disabled=busy||phase==="exit";$("next").textContent=busy?"🧽 Wassen bezig...":"🚗 Volgende klant";const c=cost();for(const k of Object.keys(c)){$(k).disabled=busy||s.cash<c[k];$({pressure:"pl",shampoo:"sl",ads:"al",staff:"el"}[k]).textContent=s[k];$({pressure:"pc",shampoo:"sc",ads:"ac",staff:"ec"}[k]).textContent=money(c[k])}}
function note(t){$("log").textContent=t}
function start(){if(busy)return;busy=true;finished=false;phase="enter";phaseStart=performance.now();car={color:colors[Math.random()*colors.length|0],program:["Basiswas","Schuim & Wax","Premium Deluxe"][Math.random()*3|0]};spots=Array.from({length:13},()=>({x:rand(115,365),y:rand(108,245),r:rand(12,24),d:1}));note("Nieuwe klant kiest "+car.program+".");update()}
function finish(){if(finished)return;finished=true;busy=false;phase="exit";phaseStart=performance.now();const earned=({"Basiswas":35,"Schuim & Wax":55,"Premium Deluxe":80}[car.program])+(s.shampoo-1)*13+s.ads*9+(Math.random()*12|0);s.cash+=earned;s.washed++;s.rep=Math.min(5,s.rep+.035);save();note("Auto schoon! +"+money(earned)+" verdiend.");update();setTimeout(()=>{if(!busy){car=null;spots=[];phase="idle"}},1700)}
function wash(x,y){if(!busy||phase!=="wash")return;spray={x,y,time:performance.now()};for(let i=0;i<5;i++)particles.push({x:x+rand(-9,9),y:y+rand(-9,9),vx:rand(-2,2),vy:rand(-4,-.6),life:1});let hit=false;for(const p of spots)if(Math.hypot(x-p.x,y-p.y)<p.r+18&&p.d>0){p.d=Math.max(0,p.d-(.11+s.pressure*.11));hit=true}if(hit){if(spots.every(p=>p.d===0))finish();else update()}}
function point(e){const r=canvas.getBoundingClientRect();wash((e.clientX-r.left)*480/r.width,(e.clientY-r.top)*340/r.height)}canvas.addEventListener("pointerdown",e=>{pointerDown=true;canvas.setPointerCapture(e.pointerId);point(e)});canvas.addEventListener("pointermove",e=>{if(pointerDown)point(e)});canvas.addEventListener("pointerup",()=>pointerDown=false);canvas.addEventListener("pointercancel",()=>pointerDown=false);$("next").onclick=start;
for(const k of ["pressure","shampoo","ads","staff"])$(k).onclick=()=>{const c=cost()[k];if(busy||phase==="exit"||s.cash<c)return;s.cash-=c;s[k]++;save();note("Upgrade gekocht: "+k+".");update()};
function rect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(t){
ctx.clearRect(0,0,480,340);
const elapsed=(t-phaseStart)/1000;
if(phase==="enter"&&elapsed>=1.35){phase="wash";phaseStart=t}
const smooth=u=>{u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)};
const slide=phase==="enter"?(1-smooth(elapsed/1.35))*-480:phase==="exit"?smooth(elapsed/1.4)*520:0;
const road=ctx.createLinearGradient(0,0,480,340);road.addColorStop(0,"#274552");road.addColorStop(1,"#122e3e");ctx.fillStyle=road;ctx.fillRect(0,0,480,340);
for(let i=0;i<14;i++){ctx.strokeStyle="rgba(186,218,225,.07)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo((i*45+t*.017)%570-45,0);ctx.lineTo((i*45+t*.017)%570-45,340);ctx.stroke()}
rect(25,28,430,282,19,"#183b50");rect(35,40,410,260,13,"#3b6572");
for(let y=53;y<300;y+=30){rect(39,y,402,2,1,"rgba(208,240,241,.08)")}
rect(58,54,364,230,13,"#193d50");rect(72,64,336,210,13,"#527783");
for(let i=0;i<2;i++){rect(80+i*306,58,13,224,5,"#80a9b8");rect(82+i*306,58,6,224,3,"#a3d8e1")}
ctx.save();ctx.translate(slide,0);
ctx.fillStyle="rgba(0,14,29,.38)";ctx.beginPath();ctx.ellipse(239,184,143,87,0,0,7);ctx.fill();
for(const wx of [126,330])for(const wy of [103,232])rect(wx,wy,23,43,5,"#162633");
const body=ctx.createLinearGradient(105,90,365,246);body.addColorStop(0,"#ffffff");body.addColorStop(.17,car?car.color:"#7ea6b4");body.addColorStop(.82,car?car.color:"#7ea6b4");body.addColorStop(1,"#183a4c");
rect(107,92,266,162,45,body);
ctx.strokeStyle="rgba(255,255,255,.33)";ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(113,98,254,150,39);ctx.stroke();
rect(168,106,147,128,26,"#1c394c");rect(182,113,119,114,19,"#7eb4c9");
ctx.fillStyle="rgba(236,253,255,.32)";ctx.beginPath();ctx.moveTo(207,116);ctx.lineTo(238,116);ctx.lineTo(201,225);ctx.lineTo(184,225);ctx.fill();
rect(113,115,20,37,8,"#fff6c5");rect(346,115,20,37,8,"#fff6c5");
rect(112,206,19,27,7,"#f55e68");rect(347,206,19,27,7,"#f55e68");
rect(145,244,187,7,4,"#173b4a");
if(car&&busy&&phase==="wash")for(const p of spots){if(!p.d)continue;ctx.fillStyle="rgba(85,52,28,"+p.d*.83+")";ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.7,-.3,0,Math.PI*2);ctx.fill()}
ctx.restore();
if(car&&phase==="wash"){
 const wave=Math.sin(t/180),foam=ctx.createRadialGradient(235+wave*16,171,6,235,171,170);
 foam.addColorStop(0,"rgba(204,252,255,.10)");foam.addColorStop(1,"rgba(204,252,255,0)");
 ctx.fillStyle=foam;ctx.fillRect(80,75,330,210);
 for(let i=0;i<19;i++){const x=110+(i*73.7)%260,y=106+(i*47)%135,rad=2+(i%4);ctx.strokeStyle="rgba(232,255,255,"+(.22+.14*Math.sin(t/390+i))+")";ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x,y+Math.sin(t/430+i)*4,rad,0,7);ctx.stroke()}
}
if(spray&&t-spray.time<230){const p=spray;ctx.strokeStyle="#b9fcff";ctx.lineWidth=5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(p.x-85,p.y+90);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.fillStyle="rgba(217,255,255,.75)";ctx.beginPath();ctx.arc(p.x,p.y,16,0,7);ctx.fill()}
particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=.035;ctx.fillStyle="rgba(197,246,255,"+Math.max(0,p.life*.75)+")";ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,7);ctx.fill()}
ctx.fillStyle="#e8faff";ctx.textAlign="center";ctx.font="bold 14px system-ui";ctx.fillText("WASBOX 01",240,22);
if(phase==="enter"||phase==="exit"){ctx.font="bold 20px system-ui";ctx.fillStyle="#ffffff";ctx.fillText(phase==="enter"?"KLANT RIJDT BINNEN":"AUTO KLAAR!",240,325)}
}
function tick(t){const dt=Math.min((t-last)/1000,.1);last=t;if(busy&&phase==="wash"&&s.staff){for(const p of spots)p.d=Math.max(0,p.d-dt*.02*s.staff);if(spots.every(p=>p.d===0))finish();else update()}draw(t);requestAnimationFrame(tick)}update();requestAnimationFrame(tick);
})();
</script></body></html>
