<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2632">
  <meta name="description" content="Carwash Tycoon — bouw en beheer je eigen wasstraat in een levende top-down gamewereld.">
  <title>Carwash Tycoon | Jouw eigen wasstraat</title>
  <link rel="stylesheet" href="./styles/game.css?v=3.1-retina-1">
</head>
<body>
<div id="app">
  <header>
    <div class="branding">
      <div class="logo" aria-hidden="true">≋</div>
      <div><div class="brand-name">CARWASH <em>TYCOON</em></div><div class="brand-sub">BUILD YOUR EMPIRE · V0.3.1</div></div>
    </div>
    <div class="statbar" aria-live="polite">
      <div class="stat money"><small>Beschikbaar</small><b id="cash">€ 2.500</b></div>
      <div class="stat"><small>Auto's</small><b id="washed">0</b></div>
      <div class="stat optional"><small>Reputatie</small><b id="reputation">3,5 ★</b></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" type="button" id="speed" aria-label="Wissel spelsnelheid" title="Wissel spelsnelheid">1×</button>
    </div>
  </header>
  <main class="world" aria-label="Top-down carwash terrein">
    <canvas id="game" aria-label="Interactieve kaart van het carwash-terrein; versleep om te bewegen en tik op installaties voor upgrades"></canvas>
    <div class="world-label"><b>● <span id="statusText">Installatie gereed</span></b><span>Wachtrij: <strong id="queueCount">0/4</strong> · Tik op een gebouw</span></div>
    <div class="map-actions" aria-label="Kaartbediening">
      <button class="icon-btn" id="zoomIn" type="button" title="Inzoomen" aria-label="Inzoomen">＋</button>
      <button class="icon-btn" id="zoomOut" type="button" title="Uitzoomen" aria-label="Uitzoomen">−</button>
      <button class="icon-btn" id="resetView" type="button" title="Wissel totaaloverzicht en detailcamera" aria-label="Wissel totaaloverzicht en detailcamera">⌖</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <aside class="panel" id="panel" role="dialog" aria-modal="false" aria-label="Terreinbeheer">
      <div class="panel-head"><div><div class="eyebrow" id="panelEyebrow">Terreinbeheer</div><h2 id="panelTitle">Wasstraat</h2></div><button id="panelClose" type="button" class="close" aria-label="Sluiten">×</button></div>
      <p id="panelDesc"></p>
      <div id="panelBody"></div>
      <button id="panelAction" type="button" class="cta">Upgrade</button>
    </aside>
  </main>
  <nav class="footer" aria-label="Spelmenu">
    <div class="footer-left">
      <button class="pill active" id="navView" type="button">Terrein</button>
      <button class="pill" id="navBuild" type="button">Bouwen</button>
      <button class="pill" id="navUpgrades" type="button">Upgrades</button>
      <button class="pill" id="navStats" type="button">Statistiek</button>
    </div>
    <div class="footer-right"><span class="status-light"></span> Automatisch opgeslagen</div>
  </nav>
</div>
<script src="./src/game.js?v=3.1-retina-1" defer></script>
</body>
</html>
